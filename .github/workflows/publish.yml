name: publish

# Publishes @broberg/fleet-contracts + @broberg/fleet-client to npm via OIDC
# Trusted Publishing — NO token/secret.
#
# PREREQUISITE (one-time): each package must already exist on npm AND have a
# Trusted Publisher configured at npmjs.com (Trusted Publisher = broberg-ai/fleet,
# workflow `publish.yml`). npm has no "pending publisher", so v0.1.0 is
# bootstrapped by hand (see PUBLISHING.md); every publish after runs here.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token npm exchanges for publish
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm (OIDC needs >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (contracts → client)
        run: pnpm -r build

      - name: Typecheck + test
        run: pnpm -r typecheck && pnpm -r test

      - name: Guard — tag matches package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for p in fleet-contracts fleet-client; do
            PKG=$(node -p "require('./packages/$p/package.json').version")
            if [ "$PKG" != "$TAG" ]; then
              echo "::error::tag v$TAG != packages/$p version $PKG"; exit 1
            fi
          done

      - name: Publish (OIDC, contracts first)
        run: |
          pnpm --filter @broberg/fleet-contracts publish --access public --no-git-checks --provenance
          pnpm --filter @broberg/fleet-client   publish --access public --no-git-checks --provenance
